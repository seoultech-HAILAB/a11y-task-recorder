<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연습 화면: 오늘의 요리 (프레임)</title>
<link rel="stylesheet" href="spike.css">
</head>
<body class="frame">
<main>
  <h1>오늘의 요리: 두부조림</h1>
  <nav aria-label="메뉴"><a href="#recipe">조리법</a> <a href="#tips">보관 팁</a> <a href="https://example.com/" target="_blank">새 창 링크(막혀야 함)</a></nav>
  <p>프레임 안 문서입니다. Tab, 화살표, H, B 키로 움직여 보세요.</p>
  <button type="button" id="show">재료 보기</button>
  <p id="ingredients" role="status" aria-live="polite"></p>
  <label for="memo">입력란(포커스 모드 전환 확인)</label>
  <input id="memo" type="text">
  <section id="recipe"><h2>조리법</h2><p>두부를 노릇하게 구운 뒤 양념장을 끼얹어 졸입니다.</p></section>
  <section id="tips"><h2>보관 팁</h2><p>남은 두부는 물에 담가 냉장 보관합니다.</p></section>
  <button type="button" id="last">프레임의 마지막 버튼</button>
</main>
<script src="frame.js"></script>
</body>
</html>
