<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스파이크: 한 창 기록기 (상위 문서)</title>
<link rel="stylesheet" href="spike.css">
</head>
<body data-phase="ready">
<header id="top">
  <h1>스파이크: 한 창 기록기</h1>
  <p id="instruction" tabindex="-1">과업 문장입니다. 아래 화면에서 '재료 보기' 버튼을 눌러 첫 번째 재료를 알려 주세요.</p>
  <div class="actions">
    <button id="read" type="button">1. 지시문에 초점 (NVDA가 읽는지)</button>
    <button id="start" type="button">2. 시작: 머리 숨기고 프레임에 초점</button>
    <button id="end" type="button">3. 종료: 프레임 잠그고 결과 머리글에 초점</button>
    <button id="reset" type="button">처음으로</button>
  </div>
  <p id="state" role="status">단계: 준비</p>
</header>
<iframe id="frame" title="과업 사이트(교차 출처)" src="http://localhost:8789/frame.html" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
<section id="result" hidden aria-labelledby="result-heading">
  <h2 id="result-heading" tabindex="-1">과업이 끝났습니다. 결과를 입력해 주세요.</h2>
  <form id="form">
    <fieldset><legend>과업을 마쳤습니까?</legend>
      <label><input type="radio" name="done" value="completed"> 마쳤습니다</label>
      <label><input type="radio" name="done" value="blocked"> 마치지 못했습니다</label>
    </fieldset>
    <label for="answer">답</label>
    <textarea id="answer" rows="2"></textarea>
    <button type="submit">저장</button>
  </form>
  <p id="saved" role="status" tabindex="-1" hidden></p>
</section>
<script src="spike.js"></script>
</body>
</html>
